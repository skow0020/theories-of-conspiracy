name: PR Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Run production build
        run: npm run build

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint


